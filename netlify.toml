# Netlify: builds the Vite site and deploys the functions in netlify/functions (served at /api/*).
# Pages are built as <name>.html, which Netlify serves at /<name> (e.g. /shopify-social-proof),
# and unknown addresses get dist/404.html with a 404 status.
# Preferred address: https://www.proofy.site. Set it as the primary domain in
# Netlify → Domain management so proofy.site redirects to it.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"
